<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172b4d">
  <title>نظام الكاشير وإدارة المحل</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <div id="application" class="application">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">ك</div>
        <div><strong>نظام الكاشير</strong><span>إدارة المحل</span></div>
      </div>
      <nav id="main-nav" class="main-nav" aria-label="القائمة الرئيسية"></nav>
      <div class="sidebar-footer"><span id="sidebar-user"></span></div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">مساحة العمل</p>
          <h1 id="page-title">الرئيسية</h1>
        </div>
        <div class="topbar-actions">
          <span id="current-user" class="badge"></span>
          <span id="active-inventory" class="badge"></span>
          <button id="backup-button" class="button secondary" type="button">نسخة احتياطية</button>
          <label class="button secondary import-button">استعادة نسخة<input id="restore-input" type="file" accept="application/json"></label>
        </div>
      </header>
      <div id="toast" class="toast" role="status"></div>
      <section id="page-content"></section>
      <p class="public-warning">تنبيه: أي شخص لديه رابط التطبيق يستطيع مشاهدة بيانات المتجر وتعديلها.</p>
    </main>
  </div>
</body>
</html>
